name: document_archive_standard
description: "نظام أرشفة المستندات Standard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # الاتصال بالـ API
  http: ^1.2.1

  # التعامل مع الملفات والمسارات
  file_picker: ^8.1.7
  path: ^1.9.0
  path_provider: ^2.1.5
  process_run: ^0.12.5

  # إنشاء وعرض وطباعة PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # إنشاء بصمة SHA-256 للملفات
  crypto: ^3.0.6

  # دعم قاعدة SQLite عند الحاجة
  sqflite_common_ffi: ^2.3.3

  # الاتصال بجهاز الأرشفة عبر TWAIN
  flutter_twain_scanner: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true